[project]
name = "moving-assistant-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "supabase>=2.5.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "anthropic>=1.2.0",
    "openai>=3.5.0",
    "geopandas>=1.1.4",
    "shapely>=2.1.2",
    "pandas>=3.0.5",
    "requests>=2.28.0",
    "arize-otel>=0.13.0",
    "openinference-instrumentation-anthropic>=2.1.6",
    "openinference-instrumentation-openai>=0.1.61",
    "openinference-instrumentation-google-genai>=0.1.0",
    "google-genai>=2.21.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installable so workspace members (currently /eval) can import `app.*`
# instead of duplicating code.
[tool.hatch.build.targets.wheel]
packages = ["app"]

