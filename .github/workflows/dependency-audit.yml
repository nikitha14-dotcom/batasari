name: Dependency audit

# Advisories get published against dependencies that are already on main.
# Blocking every PR on those is how CI goes red for reasons no PR caused, so
# the PR gate only covers what a change touches (ADR 0007). This is the other
# half: main is audited every day, and a new critical fails loudly here.
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily, off the hour to avoid the scheduler rush
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web dependency audit (critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit
        working-directory: web
        run: pnpm audit --audit-level critical

