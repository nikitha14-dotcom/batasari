name: LLM judge check

# Compares our live answers with the approved gold answers, judged by
# GLM-5.3 Flash (eval/judge/README.md). Run by hand from the Actions tab
# (Run workflow), e.g. after a model or prompt change. About $0.60 per run
# at 1 case per category.

on:
  workflow_dispatch:
    inputs:
      per_category:
        description: "Gold cases per category (Housing, Finance, Work, Education & Family)"
        default: "1"

jobs:
  ai-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the LLM judge check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          AI_JUDGE_PER_CATEGORY: ${{ inputs.per_category }}
          # Same switches as the staging API, so this judges what users get.
          ROUTER_ENABLED: "true"
          CATEGORY_PROMPTS_ENABLED: "true"
          CATEGORY_PROMPT_CATEGORIES: "Work,Finance,Education & Family,Housing"
          PRIMARY_PROVIDER: ${{ vars.PRIMARY_PROVIDER || 'claude' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python ../scripts/ai_judge_check.py

